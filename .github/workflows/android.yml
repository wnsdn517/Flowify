name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run Debug Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compress debug APK with zstd
        run: |
          mkdir -p app/build/outputs/apk/debug-zstd
          for apk in app/build/outputs/apk/debug/*.apk; do
            out="app/build/outputs/apk/debug-zstd/$(basename "$apk").zst"
            zstd -T0 -19 -f "$apk" -o "$out"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpicyEX-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload compressed debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpicyEX-debug-zstd
          path: app/build/outputs/apk/debug-zstd/*.zst
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Debug Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint/
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs:
      - build
      - lint

    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Compress release APK with zstd
        run: |
          mkdir -p app/build/outputs/apk/release-zstd
          for apk in app/build/outputs/apk/release/*.apk; do
            out="app/build/outputs/apk/release-zstd/$(basename "$apk").zst"
            zstd -T0 -19 -f "$apk" -o "$out"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release-zstd/*.zst
          generate_release_notes: true