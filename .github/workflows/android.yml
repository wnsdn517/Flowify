name: Nightly (Telegram only)

# Build a main push containing a commit with a "nightly" subject, and send its APKs only to Telegram.
# Tagged, intentional GitHub releases are handled separately by release.yml.
on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Skip unless pushed commits include a nightly subject and this SHA is new
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          nightly_commits=$(printf '%s' "$PUSH_COMMITS_JSON" \
            | jq '[.[] | (.message // "") | split("\n")[0] | select(test("(^|[[:space:]])nightly$"))] | length')
          if [ "$nightly_commits" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No pushed commit subject ends in 'nightly'; skipping build."
            exit 0
          fi
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This run is a retry; nightly builds require a new commit."
            exit 0
          fi
          successful=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .conclusion == \"success\")] | length")
          if [ "$successful" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${GITHUB_SHA} already has a successful nightly build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versionCode = git commit count; a shallow clone would reset it

      - name: Set up JDK 21
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle


      - name: Decode keystore
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/spicyex-release.jks

      - name: Make gradlew executable
        if: steps.duplicate.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Run tests and build nightly debug APK
        if: steps.duplicate.outputs.skip != 'true'
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Build signed nightly release APK
        if: steps.duplicate.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spicyex-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK signatures
        if: steps.duplicate.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spicyex-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          export PATH="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1):$PATH"
          expected=$(keytool -list -v \
            -keystore "$SIGNING_KEYSTORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          for apk in \
            app/build/outputs/apk/release/app-release.apk
          do
            actual=$(apksigner verify --print-certs "$apk" \
              | grep -m1 'certificate SHA-256 digest' \
              | awk '{print $NF}' \
              | tr '[:upper:]' '[:lower:]')
            test "$actual" = "$expected"
          done

      - name: Send nightly APKs only to Telegram
        if: success() && steps.duplicate.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CI_CHAT_ID: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
          CI_NOTIFY_SECRET: ${{ secrets.CI_NOTIFY_SECRET }}
          CI_BOT_URL: https://spicy-ex-bot.hodujw05.workers.dev
        run: bash scripts/ci-telegram.sh
