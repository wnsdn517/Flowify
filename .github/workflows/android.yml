name: CI (debug + release APK)

# CI builds both debug and signed release APKs and posts them to the Telegram CI channel.
# Publishing a release is done by release.yml (release APK only).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versionCode = git commit count; a shallow clone would reset it

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle


      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/spicyex-release.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run debug gates before release packaging
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Build signed Release APKs
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spicyex-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK signatures
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spicyex-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          export PATH="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1):$PATH"
          expected=$(keytool -list -v \
            -keystore "$SIGNING_KEYSTORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          for apk in \
            app/build/outputs/apk/release/app-release.apk
          do
            actual=$(apksigner verify --print-certs "$apk" \
              | grep -m1 'certificate SHA-256 digest' \
              | awk '{print $NF}' \
              | tr '[:upper:]' '[:lower:]')
            test "$actual" = "$expected"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: spicy-ex-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Send APKs to Telegram CI channel
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CI_CHAT_ID: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
          CI_NOTIFY_SECRET: ${{ secrets.CI_NOTIFY_SECRET }}
          CI_BOT_URL: https://spicy-ex-bot.hodujw05.workers.dev
        run: bash scripts/ci-telegram.sh
