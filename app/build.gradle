plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flowify.ettea'
    compileSdk providers.gradleProperty("SPICY_COMPILE_SDK").orElse("35").get().toInteger()

    // Keep focused JVM runs discoverable without moving the existing JUnit4 classes. Groups are
    // intentionally additive: the narrower lyrics-ai and lyrics-session groups sit inside the
    // broad lyrics group, while corpus names identify the golden language fixtures.
    def unitTestGroups = [
            settings: ['com.flowify.ettea.Settings*', 'com.flowify.ettea.settings.*',
                    'com.flowify.ettea.ui.SettingsUiStrings*'],
            diagnostics: ['com.flowify.ettea.diagnostics.*'],
            hooks: ['com.flowify.ettea.hooks.*'],
            lyrics: ['com.flowify.ettea.lyrics.*'],
            'lyrics-ai': ['com.flowify.ettea.lyrics.ai.*'],
            'lyrics-session': ['com.flowify.ettea.lyrics.session.*'],
            corpus: [
                    'com.flowify.ettea.lyrics.ChineseRomanizerTest',
                    'com.flowify.ettea.lyrics.CyrillicRomanizerTest',
                    'com.flowify.ettea.lyrics.GreekRomanizerTest',
                    'com.flowify.ettea.lyrics.language.JapaneseReadingTest',
                    'com.flowify.ettea.lyrics.language.JapaneseReadingPolicyConformanceTest',
                    'com.flowify.ettea.lyrics.language.JapaneseRomajiProjectionConformanceTest',
                    'com.flowify.ettea.lyrics.JapaneseRubyGeometryTest',
                    'com.flowify.ettea.lyrics.language.JyutpingRomanizerTest',
                    'com.flowify.ettea.lyrics.language.KoreanPronunciationTest',
                    'com.flowify.ettea.lyrics.KoreanReadingProcessorTest',
                    'com.flowify.ettea.lyrics.KoreanRomanizerTest'
            ]
    ]
    // Exporters and the billed model survey are evaluation tools, not regression tests: they
    // write files or call paid providers and assert nothing. They are excluded from every
    // default and grouped test run, and only execute with -PtestTools=<name>.
    def optInTestTools = [
            'jp-export': [
                    'com.flowify.ettea.lyrics.language.JapaneseSnapshotExporterTest',
                    'com.flowify.ettea.lyrics.language.JapaneseReadingPolicyResultExporterTest',
                    'com.flowify.ettea.lyrics.language.JapaneseRomajiProjectionResultExporterTest'
            ],
            'model-survey': ['com.flowify.ettea.lyrics.ai.OpenRouterModelSurveyTest']
    ]
    def requestedTestGroup = providers.gradleProperty('testGroup').orNull
    if (requestedTestGroup != null && !unitTestGroups.containsKey(requestedTestGroup)) {
        throw new GradleException("Unknown testGroup '${requestedTestGroup}'. Choose one of: "
                + unitTestGroups.keySet().join(', '))
    }
    def requestedTestTools = providers.gradleProperty('testTools').orNull
    if (requestedTestTools != null && !optInTestTools.containsKey(requestedTestTools)) {
        throw new GradleException("Unknown testTools '${requestedTestTools}'. Choose one of: "
                + optInTestTools.keySet().join(', '))
    }

    def keystorePath = System.getenv("SIGNING_KEYSTORE_FILE")
    def releaseStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
    // Release artifacts must retain one signing lineage. Validate the complete credential set, then
    // fail packaging tasks instead of silently producing debug-signed APKs.
    def releaseKeystoreValid = false
    def releaseSigningError = "release signing credentials are missing"
    if (keystorePath != null && !keystorePath.trim().isEmpty()
            && releaseStorePassword != null && !releaseStorePassword.isEmpty()
            && releaseKeyAlias != null && !releaseKeyAlias.trim().isEmpty()
            && releaseKeyPassword != null && !releaseKeyPassword.isEmpty()
            && new File(keystorePath).isFile()) {
        try {
            def ks = java.security.KeyStore.getInstance("JKS")
            new File(keystorePath).withInputStream { ks.load(it, releaseStorePassword.toCharArray()) }
            def key = ks.getKey(releaseKeyAlias, releaseKeyPassword.toCharArray())
            if (!(key instanceof java.security.PrivateKey) || ks.getCertificate(releaseKeyAlias) == null) {
                throw new java.security.KeyStoreException("alias does not contain a private key and certificate")
            }
            releaseKeystoreValid = true
            releaseSigningError = ""
        } catch (Throwable t) {
            releaseSigningError = "release signing credentials are unusable (" + t.class.simpleName + ")"
        }
    }

    gradle.taskGraph.whenReady { graph ->
        def packagesRelease = graph.allTasks.any { task ->
            task.project == project && task.name.toLowerCase(java.util.Locale.ROOT)
                    .matches("(assemble|package|bundle).*release.*")
        }
        if (packagesRelease && !releaseKeystoreValid) {
            throw new GradleException("SpicyEX: ${releaseSigningError}; refusing to create release artifacts.")
        }
    }

    defaultConfig {
        applicationId "com.flowify.ettea"
        minSdk 27
        targetSdk 35
        // Fork version: MAJOR (large refactor) . MINOR (features) . PATCH (bug fixes), set in
        // gradle.properties; the version code is computed below. Shown as "nightly 2.0.0": C = this fork's commit count,
        // B = the version code of the upstream build the fork is based on, then the build date.
        def forkMajor = (project.findProperty("spicyForkMajor") ?: "2").toString().toInteger()
        def forkMinor = (project.findProperty("spicyForkMinor") ?: "0").toString().toInteger()
        def forkPatch = (project.findProperty("spicyForkPatch") ?: "0").toString().toInteger()
        def git = { List<String> args ->
            try {
                def proc = (["git"] + args).execute(null, rootProject.projectDir)
                def out = proc.text.trim()
                proc.waitFor()
                return proc.exitValue() == 0 ? out : null
            } catch (Throwable ignored) {
                return null
            }
        }
        def commitCount = git(["rev-list", "--count", "HEAD"]) ?: "0"
        // The version code counts itself: every commit raises it, so any newer build installs
        // over an older one with nothing to bump by hand. (11000 keeps it above the 10600 the
        // first 1.6.0 builds used.)
        def forkCode = 11000 + commitCount.toInteger()
        def gitSha = git(["rev-parse", "--short=8", "HEAD"]) ?: "unknown"
        def upstreamBase = (project.findProperty("spicyUpstreamBaseCode") ?: "0").toString()
        def base = git(["merge-base", "HEAD", "upstream/main"])
        if (base != null) {
            def upstreamGradle = git(["show", base + ":app/build.gradle"])
            def found = upstreamGradle == null ? null : (upstreamGradle =~ /versionCode\s+(\d+)/)
            if (found != null && found.find()) upstreamBase = found.group(1)
        }
        def buildDate = new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
        def forkVersion = "${forkMajor}.${forkMinor}.${forkPatch}"
        def forkVersionName = "nightly ${forkVersion}"
        def buildTag = "C${commitCount}B${upstreamBase}_${buildDate}"
        versionCode forkCode
        versionName forkVersionName
        buildConfigField "String", "FORK_VERSION", "\"${forkVersion}\""
        buildConfigField "int", "FORK_VERSION_CODE", "${forkCode}"
        buildConfigField "String", "BUILD_TAG", "\"${buildTag}\""
        buildConfigField "int", "COMMIT_COUNT", "${commitCount}"
        buildConfigField "int", "UPSTREAM_BASE_CODE", "${upstreamBase}"
        buildConfigField "String", "BUILD_DATE", "\"${buildDate}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
        ext.spicyApkTag = "${forkVersion}-${buildTag}"
        def diagnosticIntakeUrl = providers.gradleProperty("DIAGNOSTIC_INTAKE_URL")
                .orElse("https://reports.eza.dpdns.org/v1/reports")
                .get()
        buildConfigField "String", "DIAGNOSTIC_INTAKE_URL", "\"${diagnosticIntakeUrl}\""
        def modelPackUrl = providers.gradleProperty("LANGUAGE_MODEL_PACK_URL")
            .orElse("https://github.com/wnsdn517/Flowify/releases/download/v1/spicyex-language-models-v1.zip")
            .get()
        def modelPackSha256 = providers.gradleProperty("LANGUAGE_MODEL_PACK_SHA256")
            .orElse("fab585db878657fb124e49722f4579aaeb994b902b1dbf288b4b17700f90eb37")
            .get()
        buildConfigField "String", "LANGUAGE_MODEL_PACK_URL", "\"${modelPackUrl}\""
        buildConfigField "String", "LANGUAGE_MODEL_PACK_SHA256", "\"${modelPackSha256}\""

    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    // The bridge contract is kept as Java source so ARM64 Termux builds do not require the
    // host-only Android SDK aidl executable.
    sourceSets {
        main {
            aidl.srcDirs = []
        }
        // Model files are delivered only through the language model pack, never inside the APK.
        // JVM tests still read the JMdict tables straight from the pack's source folder.
        test {
            resources.srcDirs += 'language-models'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystoreValid) {
                storeFile file(keystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystoreValid) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.all {
            filter {
                if (requestedTestTools != null) {
                    optInTestTools[requestedTestTools].each { includeTestsMatching(it) }
                } else {
                    optInTestTools.values().flatten().each { excludeTestsMatching(it) }
                    if (requestedTestGroup != null) {
                        unitTestGroups[requestedTestGroup].each { includeTestsMatching(it) }
                    }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/CONTRIBUTORS.md',
                    'META-INF/LICENSE.md'
            ]
            // The libraries ship their own copies of these models; the language model pack
            // carries them instead (see packageLanguageModelPack).
            excludes += [
                    'com/atilika/kuromoji/unidic/*.bin',
                    'org/apache/tika/langdetect/charsoup/*.bin'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    // Test-runtime copy of the hook API so adapter seam tests can drive a fake
    // interceptor chain on the JVM. Production stays compileOnly (no API in APK).
    testImplementation 'io.github.libxposed:api:102.0.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Motion artwork (Apple's clips are HLS, which the platform MediaPlayer cannot decode).
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.luckypray:dexkit:2.0.0'
    // OkHttp 5 races IPv4/IPv6 (Happy Eyeballs fast fallback, on by default) instead of
    // trying routes in order. Required baseline on networks with a blackholed IPv6 route,
    // where 4.x burned the full connect timeout per new connection. See
    // docs/backlog/HAPPY_EYEBALLS_TRANSPORT_REQUIREMENTS.md.
    implementation 'com.squareup.okhttp3:okhttp:5.0.0'
    // Genius fallback source: parses the lyrics page's HTML (see GeniusAdapter).
    implementation 'org.jsoup:jsoup:1.18.3'
    // WebViewCompat/WebViewFeature - document-start JS injection for the Connect web player.
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'org.apache.tika:tika-langdetect-charsoup-core:4.0.0'
    implementation 'com.atilika.kuromoji:kuromoji-unidic:0.9.0'
    implementation 'com.belerweb:pinyin4j:2.5.1'
    // NewPipe Extractor for YouTube Music stream resolution (stripped of Utils.class conflict).
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.35.0'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
}

// Creates the ZIP consumed by LanguageModelPack. Publish it from a trusted HTTPS
// release location and pass its SHA-256 when building the external-model APK.
tasks.register("packageLanguageModelPack", Zip) {
    archiveFileName = "spicyex-language-models-v1.zip"
    destinationDirectory = layout.buildDirectory.dir("language-models")
    // Byte-identical for the same models, so build-install.sh can tell an unchanged pack by its
    // hash (and skip copying it to the device again) even after a clean build.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from("language-models")
    from(configurations.debugRuntimeClasspath.collect { zipTree(it) }) {
        include "com/atilika/kuromoji/unidic/*.bin"
        include "org/apache/tika/langdetect/charsoup/langdetect-20260320.bin"
        eachFile { details ->
            if (details.path.startsWith("com/atilika/kuromoji/unidic/")) {
                details.path = "kuromoji/" + details.name
            } else {
                details.path = "tika/" + details.name
            }
        }
        includeEmptyDirs = false
    }
}


// Persist version-stamped debug APKs to <repo>/artifacts/ so installs do not dig through build/.
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != 'debug') return
    def cap = variant.name.capitalize()
    tasks.register("copy${cap}Apk", Copy) {
        from layout.buildDirectory.file("outputs/apk/debug/app-debug.apk")
        into rootProject.layout.projectDirectory.dir('artifacts')
        rename { "SpicyEX-debug-${android.defaultConfig.ext.spicyApkTag}.apk" }
    }
    tasks.named("assemble${cap}").configure { finalizedBy "copy${cap}Apk" }
}
